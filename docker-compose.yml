name: iris-resolve-agent

services:
  iris:
    build:
      context: .
      dockerfile: Dockerfile
    image: iris-resolve-agent:local
    container_name: iris-ai-hub

    environment:
      IRIS_PASSWORD: "${IRIS_PASSWORD}"
      PYTHONPATH: "/opt/irisapp/python-packages:/opt/irisapp/src/python"

    ports:
      - "9091:1972"
      - "9092:52773"

    volumes:
      - ./src:/opt/irisapp/src
      - iris-mgr:/usr/irissys/mgr

volumes:
  iris-mgr:
