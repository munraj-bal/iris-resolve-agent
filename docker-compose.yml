name: iris-resolve-agent

services:
  iris:
    build:
      context: .
      dockerfile: Dockerfile
    image: iris-resolve-agent:local
    container_name: iris-ai-hub

    environment:
      IRIS_PASSWORD: "${IRIS_PASSWORD}"
      PYTHONPATH: "/opt/irisapp/python-packages:/opt/irisapp/src/python"
      DOCS_DATABASE_PATH: /opt/irisapp/data/documentation/docs.db

    ports:
      - "9091:1972"
      - "9092:52773"

    volumes:
      - ./src:/opt/irisapp/src
      - iris-mgr:/usr/irissys/mgr
      - ./data/documentation:/opt/irisapp/data/documentation

volumes:
  iris-mgr:
